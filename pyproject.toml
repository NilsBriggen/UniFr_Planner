[project]
name = "unifr-planner"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "alembic==1.16.5",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "beautifulsoup4==4.13.5",
  "icalendar==6.3.1",
  "argon2-cffi==25.1.0",
  "jsonschema==4.25.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "httpx==0.28.1",
    "ruff==0.12.11",
    "mypy==1.17.1",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/domain/tests", "packages/ingest/tests"]
pythonpath = ["apps/api", "packages/domain/src", "packages/ingest/src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "apps/api:packages/domain/src:packages/ingest/src"
files = ["apps/api/unifr_api", "packages/domain/src", "packages/ingest/src"]

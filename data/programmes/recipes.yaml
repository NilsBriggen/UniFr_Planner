combinationRules:
  - id: economics-law-required-minor
    when:
      major: bachelor-eco-ecoius
    sourceIds:
      - directory-bachelor-eco-ecoius
    reviewStatus: verified
    explanation: The programme prescribes a 60-credit Law minor.
    actions:
      - kind: require_component
        subject: law
        role: minor
        ects: 60
  - id: cs-business-informatics-30
    when:
      major: bachelor-digitinf-informatics
      components:
        - bachelor-digitinf-businessinformatics
    sourceIds:
      - directory-bachelor-digitinf-businessinformatics
      - ses-minors
      - ses-full
      - bi-department
      - bi-60-web-extract
    reviewStatus: needs_clarification
    explanation: CS-specific smaller minor has an unresolved 30/33-credit discrepancy.
    actions:
      - kind: replace_requirements
        component: bachelor-digitinf-businessinformatics
        variantId: minor-30
        requirements:
          id: bi-minor
          kind: all_of
          title:
            de: Wirtschaftsinformatik · 33 ECTS · Hauptfach Informatik
            fr: Informatique de gestion · 33 ECTS · majeure informatique
            en: Business Informatics · 33 ECTS · CS major
          minCredits: 33
          children:
            - id: bi-wi1
              kind: course
              codes: []
